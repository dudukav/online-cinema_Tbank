global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: producer
    metrics_path: /metrics
    static_configs:
      - targets:
          - producer:8080

  - job_name: aggregator
    metrics_path: /metrics
    static_configs:
      - targets:
          - aggregator:8081

  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: kafka
    static_configs:
      - targets:
          - kafka-exporter:9308

  - job_name: clickhouse
    metrics_path: /metrics
    static_configs:
      - targets:
          - clickhouse:9363
